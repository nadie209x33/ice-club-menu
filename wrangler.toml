# Configuración de Cloudflare Pages.
# pages_build_output_dir hace que Pages tome los bindings de este archivo; no debe quitarse.
name = "ice-club-menu"
compatibility_date = "2026-11-01"
pages_build_output_dir = "dist"

# Base de datos D1 (SQLite).
[[d1_databases]]
binding = "DB"
database_name = "ice-club-db"
database_id = "957895d9-0f86-4d27-ab48-5bde93abab86"
migrations_dir = "migrations"

# Almacén R2 para las fotos de sabores y productos.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ice-club-images"
