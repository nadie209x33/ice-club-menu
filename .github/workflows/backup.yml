# Copia de seguridad semanal de la carta (sabores, secciones y productos).
# Exporta esas tablas de la base de producción y guarda el archivo SQL como
# artefacto descargable durante 90 días.
#
# No incluye la tabla de administradores: el repositorio es público y esa tabla
# contiene el hash de la contraseña. Tampoco incluye las fotos, que viven en R2.
#
# Requiere dos secretos del repositorio: CLOUDFLARE_API_TOKEN (permiso D1: Edit)
# y CLOUDFLARE_ACCOUNT_ID. Sin ellos el flujo termina con un aviso y sin copia.
name: Copia de seguridad

on:
  schedule:
    # Lunes a las 08:00 UTC (3:00 a. m. en Colombia).
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Comprobar los secretos
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Faltan los secretos CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID; no se hizo la copia."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - name: Exportar la carta
        if: steps.secrets.outputs.ready == 'true'
        run: >
          npx wrangler d1 export ice-club-db --remote
          --table flavors --table categories --table products
          --output carta.sql

      # La exportación por tablas no incluye los índices: se añaden al final del archivo.
      - name: Añadir los índices
        if: steps.secrets.outputs.ready == 'true'
        run: cat scripts/indices.sql >> carta.sql

      - name: Verificar la copia
        if: steps.secrets.outputs.ready == 'true'
        run: |
          test -s carta.sql
          grep -q 'INSERT INTO' carta.sql
          grep -q 'CREATE INDEX' carta.sql
          if grep -qi 'password_hash' carta.sql; then
            echo "::error::La copia contiene datos de administradores; no se publica."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: copia-carta-${{ github.run_number }}
          path: carta.sql
          retention-days: 90
          if-no-files-found: error
